name: CI

on:
  push:
    branches: [ 1.x.x, main, develop, 'feature/**' ]
  pull_request:
    branches: [ 1.x.x, main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-swift-package:
    name: Test Swift Package
    runs-on: macos-latest
    
    strategy:
      fail-fast: false
      matrix:
        xcode: ['16.4']
        
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Select Xcode ${{ matrix.xcode }}
      run: sudo xcode-select -switch /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
      
    - name: Show versions
      run: |
        xcodebuild -version
        swift --version
        
    - name: Cache Swift PM
      uses: actions/cache@v4
      with:
        path: .build
        key: ${{ runner.os }}-xcode${{ matrix.xcode }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-xcode${{ matrix.xcode }}-spm-
          
    - name: Resolve Package Dependencies
      run: swift package resolve
      
    - name: Build Debug
      run: swift build -c debug
      
    # - name: Build Release  
    #   run: swift build -c release
      
    - name: Run Tests
      run: |
        swift test \
          --parallel \
          # --enable-code-coverage \
          # --enable-experimental-swift-testing \
          --build-path .build
          
    # - name: Generate Code Coverage
    #   if: matrix.xcode == '16.4'
    #   run: |
    #     xcrun llvm-cov export \
    #       .build/arm64-apple-macosx/debug/SwiftUI-UDFPackageTests.xctest/Contents/MacOS/SwiftUI-UDFPackageTests \
    #       --format="lcov" \
    #       --instr-profile .build/debug/codecov/default.profdata \
    #       > coverage.lcov
          
    # - name: Upload Coverage to Codecov
    #   if: matrix.xcode == '16.4'
    #   uses: codecov/codecov-action@v4
    #   with:
    #     file: coverage.lcov
    #     token: ${{ secrets.CODECOV_TOKEN }}
    #     fail_ci_if_error: false
        
  validate-package:
    name: Validate Package
    runs-on: macos-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Validate Package
      run: |
        swift package describe
        
